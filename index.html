<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Shoper/Homerpage</title>
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      body {
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!--Nav bar-->
    <nav style="height: 100px" class="navbar fixed-top px-3 row shadow">
      <div
        class="h-100 col-6 col-md-3 logo-box d-flex flex-row align-items-center gap-1 justify-content-between"
      >
        <img class="h-100" src="./img/Moon Shoper.png" alt="logo" />
        <h1 style="font-size: 30px" class="fw-bold w-100 text-primary">
          Moon Shoper
        </h1>
      </div>
      <div
        class="navbar-md-box d-none col-md-2 d-md-flex justify-content-between flex-row gap-3"
      >
        <a href="#">Home</a>
        <a href="#">Cart</a>
        <a href="#">Contact</a>
        <a href="#">App</a>
        <a href="#">About</a>
      </div>
      <div
        class="col-6 col-md-3 h-100 search-and-bar-box d-flex flex-row align-items-center justify-content-end gap-2"
      >
        <div
          class="d-flex w-75 flex-row align-items-center justify-content-between form-check"
        >
          <input
            id="input-type-search"
            style="background: rgb(214, 214, 214, 0.5)"
            class="w-100 form-control rounded-5 rounded-end-0"
            type="search"
          />
          <i
            style="padding: 7px"
            class="bi bi-search shadow ps-1 bg-light h-100 rounded-end-5"
          ></i>
        </div>
        <div style="width: fit-content" class="">
          <button
            class="navbar-toggler btn-close-white"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasDarkNavbar"
            aria-controls="offcanvasDarkNavbar"
            aria-label="Toggle navigation"
          >
            <i class="navbar-toggler-icon fs-4 text-white"></i>
          </button>
          <div
            style="height: 1000px"
            class="offcanvas offcanvas-end text-bg-dark rounded-2 overflow-hidden"
            tabindex="-1"
            id="offcanvasDarkNavbar"
            aria-labelledby="offcanvasDarkNavbarLabel"
          >
            <div class="offcanvas-header bg-light text-black">
              <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">
                Moon Shoper/menu
              </h5>
              <button
                type="button"
                class="btn-close btn-close-black me-1 mb-2"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              ></button>
            </div>
            <div
              id="menu-box"
              style="text-decoration: none; color: black"
              class="offcanvas-body bg-light-subtle d-flex h-100 flex-column gap-2 p-2"
            >
              <a href="#">HOME</a>
              <a href="#">CART</a>
              <a href="#">CONTACT</a>
              <a href="#">ABOUT</a>
              <a href="#">APP</a>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="w-100">
      <img
        class="object-fit-contain w-100"
        src="./img/moon-mqcx9pq0fg2ma4lp.jpg"
        alt=""
      />
    </div>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
